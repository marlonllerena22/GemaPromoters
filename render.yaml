services:
  - type: web
    name: gemapromoters
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/gemapromoters.sqlite
    disk:
      name: gemapromoters-data
      mountPath: /var/data
      sizeGB: 1
