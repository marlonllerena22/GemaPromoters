services:
  - type: web
    name: gemapromoters
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/gemapromoters.sqlite
      - key: PUBLIC_APP_URL
        value: https://promotersec.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BENDO_WEBHOOK_SECRET
        generateValue: true
      - key: BENDO_CLIENT_ID
        sync: false
      - key: BENDO_CLIENT_SECRET
        sync: false
      - key: BENDO_AUTH_URL
        value: https://auth.prd.geopagos.io/oauth/token
      - key: BENDO_API_URL
        value: https://api.prd.geopagos.io
      - key: TICKETING_SERVICE_FEE_PERCENT
        value: 10
    disk:
      name: gemapromoters-data
      mountPath: /var/data
      sizeGB: 1
